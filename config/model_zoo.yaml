    task: "classification"
    feature_set: "agg"
    needs_scaling: false
    supports_class_weight: true
    n_tuning_trials: 20
    time_budget_seconds: 50
    key_hyperparameter: "max_iter"
    key_hyperparameter_range: [40, 80, 120, 160, 200]
    search_space:
