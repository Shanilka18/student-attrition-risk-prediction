feature_sets:
  raw28:
    name: "raw28"
    description: "28 canonical ordinal survey indicators (imputed with high-missingness binary indicators)"
    num_canonical_indicators: 28
    scaling_required: "for_linear_models"
    status: "active"

  agg:
    name: "agg"
    description: "Raw 28 indicators plus 68 longitudinal dynamics and composite features (total 100 features)"
    num_canonical_indicators: 28
    num_engineered_dynamics: 56
    num_composite_features: 12
    scaling_required: "for_linear_models"
    status: "active"

  single_signal:
    name: "single_signal"
    description: "resource_access_p1..p4 only; Moodle/LMS login imitation baseline"
    num_canonical_indicators: 4
    scaling_required: "for_linear_models"
    status: "active"

  sequence:
    name: "sequence"
    description: "3D tensor (n_samples, 4 periods, 7 indicators) for short-sequence models"
    tensor_shape: [4, 7]
    scaling_required: "none"
    status: "active"

  agg_states:
    name: "agg_states"
    description: "Aggregated longitudinal features combined with HMM decoded states and clustering memberships (total 126 features)"
    scaling_required: "for_linear_models"
    status: "active"

  states_only:
    name: "states_only"
    description: "Unsupervised latent state features only (HMM decoded states, posteriors, clustering one-hot and distance; total 26 features)"
    scaling_required: "for_linear_models"
    status: "active"

imbalance_policy:
  default_method: "class_weights"
  cost_sensitive_weighting: "balanced"
  alternative_method: "smote_inside_cv"
  phase_evaluated: "phase_06"

tuning_protocol:
  seed: 42
  outer_cv_folds: 15
  inner_tuning_cv_folds: 5
  time_budget_minutes_total: 40
  optuna_sampler: "tpe"

models:
  # =========================================================================
  # CATEGORY 1: BASELINE BENCHMARKS
  # =========================================================================
  single_signal_lr:
    id: "single_signal_lr"
    display_name: "Single-Signal Logistic Regression"
    plain_name: "Login-Frequency Linear Baseline"
    category: "baseline"
    task: "classification"
    feature_set: "single_signal"
    needs_scaling: true
    supports_class_weight: true
    n_tuning_trials: 0
    time_budget_seconds: 30
    key_hyperparameter: "C"
    key_hyperparameter_range: [0.01, 0.1, 1.0, 10.0]
    fixed_params:
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000

  majority_dummy:
    id: "majority_dummy"
    display_name: "Majority Class Dummy Classifier"
    plain_name: "Zero-Intelligence Baseline"
    category: "baseline"
    task: "classification"
    feature_set: "agg"
    needs_scaling: false
    supports_class_weight: false
    n_tuning_trials: 0
    time_budget_seconds: 15
    fixed_params:
      strategy: "prior"

  rule_login_imitation:
    id: "rule_login_imitation"
    display_name: "Moodle Login Frequency Rule"
    plain_name: "Static Cut-Off Heuristic"
    category: "baseline"
    task: "classification"
    feature_set: "single_signal"
    needs_scaling: false
    supports_class_weight: false
    n_tuning_trials: 0
    time_budget_seconds: 15
    fixed_params:
      threshold: 2.0

  # =========================================================================
  # CATEGORY 2: LINEAR MODELS
  # =========================================================================
  logistic_regression_l2:
    id: "logistic_regression_l2"
    display_name: "Logistic Regression (L2 Ridge)"
    plain_name: "Penalized Linear Odds Model"
    category: "linear"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: true
    n_tuning_trials: 20
    time_budget_seconds: 45
    key_hyperparameter: "C"
    key_hyperparameter_range: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    search_space:
      C:
        type: "float"
        low: 0.001
        high: 100.0
        log: true

  logistic_regression_elasticnet:
    id: "logistic_regression_elasticnet"
    display_name: "Logistic Regression (Elastic-Net)"
    plain_name: "Sparse & Shrinkage Linear Model"
    category: "linear"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: true
    n_tuning_trials: 20
    time_budget_seconds: 60
    key_hyperparameter: "l1_ratio"
    key_hyperparameter_range: [0.1, 0.3, 0.5, 0.7, 0.9]
    search_space:
      C:
        type: "float"
        low: 0.01
        high: 10.0
        log: true
      l1_ratio:
        type: "float"
        low: 0.05
        high: 0.95

  linear_svm_calibrated:
    id: "linear_svm_calibrated"
    display_name: "Calibrated Linear SVM"
    plain_name: "Maximum Margin Linear Classifier"
    category: "linear"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: true
    n_tuning_trials: 15
    time_budget_seconds: 45
    key_hyperparameter: "C"
    key_hyperparameter_range: [0.001, 0.01, 0.1, 1.0, 10.0]
    search_space:
      C:
        type: "float"
        low: 0.001
        high: 10.0
        log: true

  ridge_calibrated:
    id: "ridge_calibrated"
    display_name: "Calibrated Ridge Classifier"
    plain_name: "L2 Least-Squares Classifier"
    category: "linear"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: true
    n_tuning_trials: 15
    time_budget_seconds: 40
    key_hyperparameter: "alpha"
    key_hyperparameter_range: [0.1, 1.0, 10.0, 100.0, 1000.0]
    search_space:
      alpha:
        type: "float"
        low: 0.01
        high: 1000.0
        log: true

  lda:
    id: "lda"
    display_name: "Linear Discriminant Analysis (LDA)"
    plain_name: "Covariance-Based Linear Discriminant"
    category: "linear"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: false
    n_tuning_trials: 10
    time_budget_seconds: 30
    key_hyperparameter: "shrinkage"
    key_hyperparameter_range: [0.0, 0.2, 0.5, 0.8, 1.0]
    search_space:
      shrinkage:
        type: "float"
        low: 0.0
        high: 1.0

  # =========================================================================
  # CATEGORY 3: CLASSICAL / SHALLOW MODELS
  # =========================================================================
  knn:
    id: "knn"
    display_name: "k-Nearest Neighbours"
    plain_name: "Distance-Based Peer Classifier"
    category: "classical"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: false
    n_tuning_trials: 15
    time_budget_seconds: 45
    key_hyperparameter: "n_neighbors"
    key_hyperparameter_range: [3, 5, 9, 15, 25, 35]
    search_space:
      n_neighbors:
        type: "int"
        low: 3
        high: 41
        step: 2
      weights:
        type: "categorical"
        choices: ["uniform", "distance"]

  gaussian_nb:
    id: "gaussian_nb"
    display_name: "Gaussian Naive Bayes"
    plain_name: "Independent Feature Probability Model"
    category: "classical"
    task: "classification"
    feature_set: "agg"
    needs_scaling: true
    supports_class_weight: false
    n_tuning_trials: 10
    time_budget_seconds: 25
    key_hyperparameter: "var_smoothing"
    key_hyperparameter_range: [1e-11, 1e-9, 1e-7, 1e-5, 1e-3]
    search_space:
      var_smoothing:
        type: "float"
        low: 1e-11
        high: 1e-3
        log: true

  decision_tree:
    id: "decision_tree"
    display_name: "Decision Tree"
    plain_name: "Single Hierarchical Rule Tree"
    category: "classical"
    task: "classification"
    feature_set: "agg"
    needs_scaling: false
    supports_class_weight: true
    n_tuning_trials: 20
    time_budget_seconds: 30
    key_hyperparameter: "max_depth"
    key_hyperparameter_range: [2, 3, 4, 6, 8, 12]
    search_space:
      max_depth:
        type: "int"
        low: 2
        high: 12
      min_samples_split:
        type: "int"
        low: 5
        high: 50

  svm_rbf:
    id: "svm_rbf"
    display_name: "Support Vector Machine (RBF Kernel)"
    plain_name: "Non-Linear Radial Basis Machine"
