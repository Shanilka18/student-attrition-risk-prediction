      learning_rate:
        type: "float"
        low: 0.02
        high: 0.2
        log: true
      depth:
        type: "int"
        low: 3
        high: 7

  adaboost:
    id: "adaboost"
    display_name: "AdaBoost"
    plain_name: "Adaptive Sample-Reweighted Boosting"
    category: "boosting"
    task: "classification"
    feature_set: "agg"
    needs_scaling: false
