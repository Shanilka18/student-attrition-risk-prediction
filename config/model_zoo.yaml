        low: 0.02
        high: 0.2
        log: true
      num_leaves:
        type: "int"
        low: 15
        high: 63
      subsample:
        type: "float"
        low: 0.6
        high: 1.0

  catboost:
    id: "catboost"
    display_name: "CatBoost"
    plain_name: "Symmetric Oblivious Decision Trees"
    category: "boosting"
    task: "classification"
    feature_set: "agg"
    needs_scaling: false
