    category: "classical"
    task: "classification"
    feature_set: "agg"
    needs_scaling: false
    supports_class_weight: true
    n_tuning_trials: 20
    time_budget_seconds: 60
    key_hyperparameter: "n_estimators"
    key_hyperparameter_range: [50, 100, 150, 200, 300]
    search_space:
      n_estimators:
        type: "int"
        low: 50
        high: 300
        step: 50
      max_depth:
        type: "int"
